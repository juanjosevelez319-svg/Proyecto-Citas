<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <title>Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<header class="header">

    <h2>Hospital Citas</h2>

    <a th:href="@{/inicio}">
        Inicio
    </a>

    <a th:href="@{/usuarios}">
        Usuarios
    </a>

    <a th:href="@{/citas}">
        Citas
    </a>

    <a th:href="@{/medico}">
        Médicos
    </a>

    <a th:href="@{/horarios}">
        Horarios
    </a>

</header>


<main class="contenido">

    <h2>
        Lista de Usuarios
    </h2>


    <a th:href="@{/usuarios/nuevo}"
       class="btn btn-primary mb-3">

        Nuevo Usuario

    </a>


    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Cédula</th>
                    <th>Correo</th>
                    <th>Contacto</th>
                    <th>Rol</th>
                    <th>Acciones</th>

                </tr>

            </thead>


            <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td th:text="${usuario.id}">
                    </td>

                    <td th:text="${usuario.nombre}">
                    </td>

                    <td th:text="${usuario.cedula}">
                    </td>

                    <td th:text="${usuario.correo}">
                    </td>

                    <td th:text="${usuario.contacto}">
                    </td>

                    <td th:text="${usuario.rol}">
                    </td>


                    <td>

                        <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                           class="btn btn-warning btn-sm">

                            Editar

                        </a>


                        <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                           class="btn btn-danger btn-sm">

                            Eliminar

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<footer class="footer">

    <p>
        Sistema de Gestión de Citas - Hospital
    </p>

</footer>


</body>

</html>
