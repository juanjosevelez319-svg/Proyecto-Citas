<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">

<head>

    <meta charset="UTF-8">

    <title>Lista de Citas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


    <!-- ========================= -->
    <!-- TÍTULO -->
    <!-- ========================= -->

    <h2 class="mb-4">
        Listado de Citas
    </h2>


    <!-- ========================= -->
    <!-- NUEVA CITA -->
    <!-- ========================= -->

    <a th:href="@{/citas/nuevaCita}"
       class="btn btn-success mb-3">

        Nueva Cita

    </a>


    <!-- ========================= -->
    <!-- MENSAJE EXITOSO -->
    <!-- ========================= -->

    <div th:if="${mensaje}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <strong>Correcto:</strong>

        <span th:text="${mensaje}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <!-- ========================= -->
    <!-- MENSAJE DE ERROR -->
    <!-- ========================= -->

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <strong>Advertencia:</strong>

        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <!-- ========================= -->
    <!-- TABLA -->
    <!-- ========================= -->

    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Paciente</th>

                <th>Médico</th>

                <th>Especialidad</th>

                <th>Fecha</th>

                <th>Horario</th>

                <th>Estado</th>

                <th>Confirmar</th>

                <th>Cancelar</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="cita : ${citas}">

                <!-- ID -->

                <td th:text="${cita.id}">
                </td>


                <!-- PACIENTE -->

                <td th:text="${cita.usuario.nombre}">
                </td>


                <!-- MÉDICO -->

                <td th:text="${cita.medico.nombre}">
                </td>


                <!-- ESPECIALIDAD -->

                <td th:text="${cita.medico.especialidad}">
                </td>


                <!-- FECHA -->

                <td>

                    <span th:if="${cita.horario.fecha != null}"
                          th:text="${#temporals.format(cita.horario.fecha, 'dd/MM/yyyy')}">
                    </span>

                    <span th:if="${cita.horario.fecha == null}"
                          class="text-muted">

                        Sin fecha

                    </span>

                </td>


                <!-- HORARIO -->

                <td>

                    <span th:if="${cita.horario.fecha != null
                                  and cita.horario.horaInicio != null
                                  and cita.horario.horaFin != null}"
                          th:text="${#temporals.format(cita.horario.horaInicio, 'hh:mm a')
                                  + ' - '
                                  + #temporals.format(cita.horario.horaFin, 'hh:mm a')}">
                    </span>

                    <span th:if="${cita.horario.fecha == null}"
                          class="text-muted">

                        Horario antiguo

                    </span>

                </td>


                <!-- ESTADO -->

                <td>

                    <span th:if="${cita.estado.name() == 'PENDIENTE'}"
                          class="badge bg-warning text-dark">

                        Pendiente

                    </span>

                    <span th:if="${cita.estado.name() == 'CONFIRMADA'}"
                          class="badge bg-success">

                        Confirmada

                    </span>

                    <span th:if="${cita.estado.name() == 'CANCELADA'}"
                          class="badge bg-secondary">

                        Cancelada

                    </span>

                </td>


                <!-- CONFIRMAR -->

                <td>

                    <a th:if="${cita.estado.name() == 'PENDIENTE'}"
                       th:href="@{/citas/confirmarCita/{id}(id=${cita.id})}"
                       class="btn btn-primary btn-sm">

                        Confirmar

                    </a>

                    <span th:if="${cita.estado.name() != 'PENDIENTE'}"
                          class="text-muted">

                        No disponible

                    </span>

                </td>


                <!-- CANCELAR -->

                <td>

                    <a th:if="${cita.estado.name() != 'CANCELADA'}"
                       th:href="@{/citas/cancelarCita/{id}(id=${cita.id})}"
                       class="btn btn-danger btn-sm">

                        Cancelar

                    </a>

                    <span th:if="${cita.estado.name() == 'CANCELADA'}"
                          class="text-muted">

                        Cancelada

                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- ========================= -->
    <!-- BOTONES INFERIORES -->
    <!-- ========================= -->

    <form th:action="@{/logout}"
          method="post"
          class="d-inline">

        <button type="submit"
                class="btn btn-danger">

            Cerrar sesión

        </button>

    </form>


    <a th:href="@{/inicio}"
       class="btn btn-success">

        Volver al inicio

    </a>


</div>


</body>

</html>
