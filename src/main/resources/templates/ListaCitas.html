<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>

<meta charset="UTF-8">

<title>Lista de Citas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">

Listado de Citas

</h2>

<a th:href="@{/citas/nuevaCita}" class="btn btn-success">

Nueva Cita

</a>


<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Paciente</th>

<th>Médico</th>

<th>Especialidad</th>

<th>Fecha</th>

<th>Horario</th>

<th>Estado</th>

<th>Confirmar</th>

<th>Cancelar</th>

</tr>

</thead>

<tbody>

<tr th:each="cita : ${citas}">

<td th:text="${cita.id}"></td>

<td th:text="${cita.usuario.nombre}"></td>

<td th:text="${cita.medico.nombre}"></td>

<td th:text="${cita.horario.diaSemana + ' ' + cita.horario.horaInicio}"></td>

<td th:text="${cita.estado}"></td>

<td>

<a th:href="@{/citas/confirmarCita/{id}(id=${cita.id})}"
class="btn btn-primary btn-sm">

Confirmar

</a>

</td>

<td>

<a th:href="@{/citas/cancelarCita/{id}(id=${cita.id})}"
class="btn btn-danger btn-sm">

Cancelar

</a>

</td>

</tr>

</tbody>

</table>
   <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-danger">
            Cerrar sesión
        </button>
    </form>

    <a href="/inicio" class="btn btn-success">
            Volver al inicio
    </a>
</div>

</body>

</html>
