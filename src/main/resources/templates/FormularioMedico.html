<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${medico.id == null} ? 'Nuevo Médico' : 'Editar Médico'">
        Formulario Médico
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4"
        th:text="${medico.id == null} ? 'Nuevo Médico' : 'Editar Médico'">
        Formulario Médico
    </h2>

    <form th:action="@{/medico/guardar}" th:object="${medico}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ingrese el nombre del médico" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Especialidad</label>
            <input type="text" class="form-control" th:field="*{especialidad}" placeholder="Ingrese la especialidad" required>
        </div>

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/medico}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
