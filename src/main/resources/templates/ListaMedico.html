<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Médicos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">Médicos en el sistema</h1>

    <div class="mb-3">

        <a th:href="@{/medico/nueva}" class="btn btn-success">
            Agregar Médico
        </a>

        <a th:href="@{/horarios}" class="btn btn-primary">
            Ver Horarios
        </a>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Editar</th>
                <th>Eliminar</th>
                <th>Horarios</th>
            </tr>

        </thead>
        <tbody>

            <tr th:each="medico : ${medicos}">
                <td th:text="${medico.id}"></td>
                <td th:text="${medico.nombre}"></td>
                <td th:text="${medico.especialidad}"></td>
                <td>
                    <a th:href="@{/medico/editar/{id}(id=${medico.id})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>
                </td>

                <td>
                    <a th:href="@{/medico/eliminar/{id}(id=${medico.id})}"
                       class="btn btn-danger btn-sm">
                        Eliminar
                    </a>
                </td>

                <td>
                    <a th:href="@{/medico/{id}(id=${medico.id})}"
                       class="btn btn-info btn-sm text-white">
                        Ver Horarios
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-danger">
            Cerrar sesión
        </button>

    </form>

    <a href="/inicio" class="btn btn-success">
            Volver al inicio
    </a>

</div>

</body>
</html>
