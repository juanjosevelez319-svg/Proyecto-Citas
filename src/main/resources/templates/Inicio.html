<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <title>Inicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<header class="header">

    <h2>Hospital Citas</h2>

    <a th:href="@{/inicio}">
        Inicio
    </a>

    <a th:href="@{/medico/}">
        Médicos
    </a>

    <a th:href="@{/usuarios}">
        Usuarios
    </a>

    <a th:href="@{/citas}">
        Citas
    </a>

    <a th:href="@{/horarios}">
        Horarios
    </a>

</header>


<main class="contenido">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-3">

                Bienvenido,

                <span class="text-primary"
                      sec:authentication="name">

                    usuario

                </span>

            </h2>


            <p class="text-center text-muted">

                Página de Inicio de administrador

            </p>


            <hr>


            <!-- ADMINISTRAR MÉDICOS -->

            <div class="d-grid gap-2"
                 sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/medico/}"
                   class="btn btn-primary">

                    Administrar Médicos

                </a>

            </div>


            <!-- ADMINISTRAR USUARIOS -->

            <div class="d-grid gap-2 mt-2"
                 sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/usuarios}"
                   class="btn btn-primary">

                    Administrar Usuarios

                </a>

            </div>


            <!-- ADMINISTRAR CITAS -->

            <div class="d-grid gap-2 mt-2"
                 sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/citas}"
                   class="btn btn-primary">

                    Administrar Citas

                </a>

            </div>

            <div class="d-grid gap-2 mt-2"
                 sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/reportes/citas}"
                   class="btn btn-primary">

                    Reportes de Citas

                </a>

            </div>


            <!-- CERRAR SESIÓN -->

            <div class="text-center mt-4">

                <form th:action="@{/logout}"
                      method="post">

                    <button type="submit"
                            class="btn btn-danger">

                        Cerrar sesión

                    </button>

                </form>

            </div>

        </div>

    </div>

</main>


<footer class="footer">

    <p>
        Sistema de Gestión de Citas - Hospital
    </p>

</footer>


</body>

</html>
