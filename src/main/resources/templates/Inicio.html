<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Inicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-3">
                Bienvenido,
                <span class="text-primary" sec:authentication="name">
                    usuario
                </span>
            </h2>

            <p class="text-center text-muted">
                Página de Inicio de administrador
            </p>

            <hr>

            <div class="d-grid gap-2" sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/medico/}" class="btn btn-primary">
                    Administrar Médicos
                </a>

            </div>

            <div class="d-grid gap-2" sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/usuarios}" class="btn btn-primary">
                    Administrar Usuarios
                </a>

            </div>

            <div class="d-grid gap-2" sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/citas}" class="btn btn-primary">
                    Administrar citas
                </a>

            </div>

            <div class="d-grid gap-2" sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/reportes/citas}" class="btn btn-primary">
                    Reportes de citas
                </a>

            </div>

            <div class="text-center mt-4">

                <form th:action="@{/logout}" method="post">

                    <button type="submit" class="btn btn-danger">
                        Cerrar sesión
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
