<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <title>Mis Citas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>


<body>

<header class="header">

    <h2>
        Hospital Citas
    </h2>

    <a th:href="@{/pantalla-usuarios}">
        Inicio
    </a>

    <a th:href="@{/citas/mis-citas}">
        Mis Citas
    </a>

    <a th:href="@{/citas/nuevaCita}">
        Nueva Cita
    </a>

</header>


<main class="contenido">

    <h2 class="mb-4">
        Listado de mis Citas
    </h2>


    <!-- NUEVA CITA -->

    <a th:href="@{/citas/nuevaCita}"
       class="btn btn-success mb-3">

        Nueva Cita

    </a>


    <!-- TABLA -->

    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Paciente</th>

                    <th>Médico</th>

                    <th>Horario</th>

                    <th>Estado</th>

                    <th>Cancelar</th>

                </tr>

            </thead>


            <tbody>

                <tr th:each="cita : ${citas}">

                    <!-- ID -->

                    <td th:text="${cita.id}">
                    </td>


                    <!-- PACIENTE -->

                    <td th:text="${cita.usuario.nombre}">
                    </td>


                    <!-- MÉDICO -->

                    <td th:text="${cita.medico.nombre + ' ' + cita.medico.especialidad}">
                    </td>


                    <!-- HORARIO -->

                    <td th:text="${cita.horario.diaSemana + ' ' + cita.horario.horaInicio}">
                    </td>


                    <!-- ESTADO -->

                    <td th:text="${cita.estado}">
                    </td>


                    <!-- CANCELAR -->

                    <td>

                        <a th:href="@{/citas/cancelarCita/{id}(id=${cita.id})}"
                           class="btn btn-danger btn-sm">

                            Cancelar

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- CERRAR SESIÓN -->

    <form th:action="@{/logout}"
          method="post"
          class="d-inline">

        <button type="submit"
                class="btn btn-danger">

            Cerrar sesión

        </button>

    </form>


    <a th:href="@{/pantalla-usuarios}"
       class="btn btn-success">

        Volver al inicio

    </a>

</main>


<footer class="footer">

    <p>
        Sistema de Gestión de Citas - Hospital
    </p>

</footer>


</body>

</html>
