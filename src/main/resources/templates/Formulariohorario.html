<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <title th:text="${horario.idHorario == null} ? 'Nuevo Horario' : 'Editar Horario'">
        Horario
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<header class="header">

    <h2>Hospital Citas</h2>

    <a th:href="@{/inicio}">
        Inicio
    </a>

    <a th:href="@{/citas}">
        Citas
    </a>

    <a th:href="@{/medico}">
        Médicos
    </a>

    <a th:href="@{/horarios}">
        Horarios
    </a>

</header>


<main class="contenido">

    <h2 class="text-center mb-4"
        th:text="${horario.idHorario == null} ? 'Nuevo Horario' : 'Editar Horario'">
        Nuevo Horario
    </h2>


    <!-- Mensaje de error -->

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <!-- Mensaje de éxito -->

    <div th:if="${mensaje}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${mensaje}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <form th:action="@{/guardarHorario}"
          th:object="${horario}"
          method="post">

        <!-- ID del horario -->

        <input type="hidden"
               th:field="*{idHorario}">


        <!-- MÉDICO -->

        <div class="mb-3">

            <label class="form-label">
                Médico
            </label>

            <select class="form-select"
                    name="medico"
                    required>

                <option value="">
                    Seleccione un médico
                </option>

                <option th:each="medico : ${medicos}"
                        th:value="${medico.id}"
                        th:text="${medico.nombre}">
                </option>

            </select>

        </div>


        <!-- FECHA -->

        <div class="mb-3">

            <label class="form-label">
                Fecha de disponibilidad
            </label>

            <input type="date"
                   class="form-control"
                   th:field="*{fecha}"
                   required>

        </div>


        <!-- HORA INICIO -->

        <div class="mb-3">

            <label class="form-label">
                Hora de inicio
            </label>

            <input type="time"
                   class="form-control"
                   th:field="*{horaInicio}"
                   required>

        </div>


        <!-- HORA FIN -->

        <div class="mb-3">

            <label class="form-label">
                Hora de finalización
            </label>

            <input type="time"
                   class="form-control"
                   th:field="*{horaFin}"
                   required>

        </div>


        <!-- BOTONES -->

        <button type="submit"
                class="btn btn-success">

            Guardar

        </button>

        <a th:href="@{/horarios}"
           class="btn btn-secondary">

            Cancelar

        </a>

    </form>

</main>


<footer class="footer">

    <p>
        Sistema de Gestión de Citas - Hospital
    </p>

</footer>


</body>

</html>
