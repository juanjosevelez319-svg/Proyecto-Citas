<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">

    <title>Lista de Horarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Horarios de los médicos</h2>

        <a th:href="@{/nuevoHorario}"
           class="btn btn-primary">
            Nuevo horario
        </a>

        <a th:href="@{/medico/}"
           class="btn btn-primary">
            Ver médicos
        </a>

    </div>


    <!-- Mensaje de éxito -->
    <div th:if="${mensaje}"
         class="alert alert-success"
         th:text="${mensaje}">
    </div>


    <!-- Mensaje de error -->
    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <div class="table-responsive">

        <table class="table table-bordered table-striped align-middle">

            <thead class="table-dark">

                <tr>
                    <th>Médico</th>
                    <th>Fecha</th>
                    <th>Día</th>
                    <th>Hora de inicio</th>
                    <th>Hora de fin</th>
                    <th>Disponible</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="horario : ${horarios}">

                    <!-- MÉDICO -->
                    <td th:text="${horario.medico.nombre}">
                        Médico
                    </td>


                    <!-- FECHA -->
                    <td th:text="${#temporals.format(horario.fecha, 'dd/MM/yyyy')}">
                        14/08/2026
                    </td>


                    <!-- DÍA DE LA SEMANA -->
                    <td th:text="${horario.diaSemana}">
                        FRIDAY
                    </td>


                    <!-- HORA INICIO -->
                    <td th:text="${#temporals.format(horario.horaInicio, 'hh:mm a')}">
                        10:00 AM
                    </td>


                    <!-- HORA FIN -->
                    <td th:text="${#temporals.format(horario.horaFin, 'hh:mm a')}">
                        11:00 AM
                    </td>


                    <!-- DISPONIBILIDAD -->
                    <td>

                        <span th:if="${horario.disponible}"
                              class="badge bg-success">
                            Disponible
                        </span>

                        <span th:unless="${horario.disponible}"
                              class="badge bg-danger">
                            No disponible
                        </span>

                    </td>


                    <!-- ACCIONES -->
                    <td>

                        <a th:href="@{/editarHorario/{id}(id=${horario.idHorario})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <a th:href="@{/eliminarHorario/{id}(id=${horario.idHorario})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar este horario?');">
                            Eliminar
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
