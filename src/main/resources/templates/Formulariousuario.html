<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head>

    <meta charset="UTF-8">

    <title>Formulario Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>

<body>

<header class="header">

    <h2>Hospital Citas</h2>

    <a th:href="@{/inicio}">
        Inicio
    </a>

    <a th:href="@{/usuarios}">
        Usuarios
    </a>

    <a th:href="@{/medico}">
        Médicos
    </a>

    <a th:href="@{/citas}">
        Citas
    </a>

    <a th:href="@{/horarios}">
        Horarios
    </a>

</header>


<main class="contenido">

    <h2 class="text-center mb-4">
        Formulario de Usuario
    </h2>


    <form th:action="@{/usuarios/guardar}"
          th:object="${usuario}"
          method="post">

        <input type="hidden"
               th:field="*{id}">


        <!-- NOMBRE -->

        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{nombre}"
                   required>

        </div>


        <!-- CÉDULA -->

        <div class="mb-3">

            <label class="form-label">
                Cédula
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{cedula}"
                   required>

        </div>


        <!-- CORREO -->

        <div class="mb-3">

            <label class="form-label">
                Correo
            </label>

            <input type="email"
                   class="form-control"
                   th:field="*{correo}"
                   required>

        </div>


        <!-- CONTACTO -->

        <div class="mb-3">

            <label class="form-label">
                Contacto
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{contacto}"
                   required>

        </div>


        <!-- ROL -->

        <div class="mb-3"
             sec:authorize="hasRole('ADMIN')">

            <label class="form-label">
                Rol
            </label>

            <select class="form-select"
                    th:field="*{rol}">

                <option value="ROLE_USUARIO">
                    Usuario
                </option>

                <option value="ROLE_ADMIN">
                    Administrador
                </option>

            </select>

        </div>


        <!-- CONTRASEÑA -->

        <div class="mb-3">

            <label class="form-label">
                Contraseña
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{password}"
                   placeholder="Dejar vacío para mantener la contraseña actual">

        </div>


        <!-- BOTONES -->

        <button type="submit"
                class="btn btn-success">

            Guardar

        </button>


        <a th:href="@{/usuarios}"
           class="btn btn-secondary">

            Cancelar

        </a>

    </form>

</main>


<footer class="footer">

    <p>
        Sistema de Gestión de Citas - Hospital
    </p>

</footer>


</body>

</html>
