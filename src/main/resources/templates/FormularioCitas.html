<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head>

    <meta charset="UTF-8">

    <title>Nueva Cita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/contenido.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">        

</head>

<body>

<header class="header">

    <h2>Hospital Citas</h2>

    <a th:href="@{/inicio}">
        Inicio
    </a>

    <a th:href="@{/citas}">
        Citas
    </a>

    <a th:href="@{/medico}">
        Médicos
    </a>

    <a th:href="@{/horarios}">
        Horarios
    </a>

</header>


<main class="contenido">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="text-center">
                Registrar Cita
            </h3>

        </div>


        <!-- MENSAJE DE ERROR -->

        <div class="alert alert-danger m-3"
             th:if="${error}">

            <strong>Error:</strong>

            <span th:text="${error}"></span>

        </div>


        <div class="card-body">

            <form th:action="@{/citas/guardarCita}"
                  th:object="${cita}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">


                <!-- USUARIO -->

                <div sec:authorize="hasRole('ADMIN')"
                     class="mb-3">

                    <label class="form-label">
                        Usuario
                    </label>

                    <select class="form-select"
                            th:field="*{usuario}">

                        <option value="">
                            Seleccione un usuario
                        </option>

                        <option th:each="usuario : ${usuarios}"
                                th:value="${usuario.id}"
                                th:text="${usuario.nombre}">
                        </option>

                    </select>

                </div>


                <!-- MÉDICO -->

                <div class="mb-3">

                    <label for="medicoSelect"
                           class="form-label">

                        Médico

                    </label>

                    <select id="medicoSelect"
                            class="form-select"
                            required>

                        <option value="">
                            Seleccione un médico
                        </option>

                        <option th:each="medico : ${medicos}"
                                th:value="${medico.id}"
                                th:text="${medico.nombre}">
                        </option>

                    </select>

                </div>


                <!-- HORARIO -->

                <div class="mb-3">

                    <label for="horarioSelect"
                           class="form-label">

                        Horario disponible

                    </label>

                    <select id="horarioSelect"
                            class="form-select"
                            th:field="*{horario}"
                            required>

                        <option value="">
                            Primero seleccione un médico
                        </option>

                        <option th:each="horario : ${horarios}"
                                th:value="${horario.idHorario}"
                                th:data-medico="${horario.medico.id}"
                                th:data-disponible="${horario.disponible}"
                                th:text="${#temporals.format(horario.fecha, 'dd/MM/yyyy') + ' - ' + #temporals.format(horario.horaInicio, 'hh:mm a') + ' - ' + #temporals.format(horario.horaFin, 'hh:mm a')}">
                        </option>

                    </select>

                    <div class="form-text">

                        Seleccione primero un médico para mostrar
                        sus horarios disponibles.

                    </div>

                </div>


                <!-- ESTADO -->

                <div class="mb-3"
                     sec:authorize="hasRole('ADMIN')">

                    <label class="form-label">
                        Estado
                    </label>

                    <select class="form-select"
                            th:field="*{estado}">

                        <option value="PENDIENTE">
                            Pendiente
                        </option>

                        <option value="CONFIRMADA">
                            Confirmada
                        </option>

                        <option value="CANCELADA">
                            Cancelada
                        </option>

                    </select>

                </div>


                <!-- BOTONES -->

                <button type="submit"
                        class="btn btn-success">

                    Guardar

                </button>

                <a th:href="@{/citas}"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</main>


<footer class="footer">

    <p>
        Sistema de Gestión de Citas - Hospital
    </p>

</footer>


<!-- FILTRO DE HORARIOS -->

<script>

    const medicoSelect =
        document.getElementById("medicoSelect");

    const horarioSelect =
        document.getElementById("horarioSelect");


    // Guardamos todas las opciones originales
    const horariosOriginales =
        Array.from(
            horarioSelect.querySelectorAll("option")
        ).slice(1);


    medicoSelect.addEventListener("change", function () {

        const medicoSeleccionado =
            this.value;


        // Limpiar horarios actuales
        horarioSelect.innerHTML = "";


        // Opción inicial
        const opcionInicial =
            document.createElement("option");

        opcionInicial.value = "";

        opcionInicial.textContent =
            medicoSeleccionado
                ? "Seleccione un horario"
                : "Primero seleccione un médico";

        horarioSelect.appendChild(opcionInicial);


        // Si no seleccionó médico
        if (!medicoSeleccionado) {
            return;
        }


        // Filtrar horarios
        horariosOriginales.forEach(function (opcion) {

            const medicoHorario =
                opcion.dataset.medico;

            const disponible =
                opcion.dataset.disponible === "true";


            if (medicoHorario === medicoSeleccionado
                && disponible) {

                horarioSelect.appendChild(
                    opcion.cloneNode(true)
                );

            }

        });

    });

</script>


</body>

</html>
