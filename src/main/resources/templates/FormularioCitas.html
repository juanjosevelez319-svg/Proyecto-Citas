<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>

    <meta charset="UTF-8">

    <title>Nueva Cita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="text-center">

                Registrar Cita

            </h3>

        </div>

        <div class="alert alert-danger" th:if="${error}">
         <strong>Error:</strong>
         <span th:text="${error}"></span>
        </div>

        <div class="card-body">

            <form th:action="@{/citas/guardarCita}"
                  th:object="${cita}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div sec:authorize="hasRole('ADMIN')" class="mb-3">

                    <label class="form-label">

                        Usuario

                    </label>

                    <select class="form-select"
                            th:field="*{usuario}">

                        <option value="">Seleccione un usuario</option>

                        <option th:each="usuario : ${usuarios}"
                                th:value="${usuario.id}"
                                th:text="${usuario.nombre}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Médico

                    </label>

                    <select class="form-select"
                            th:field="*{medico}">

                        <option value="">Seleccione un médico</option>

                        <option th:each="medico : ${medicos}"
                                th:value="${medico.id}"
                                th:text="${medico.nombre}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Horario

                    </label>

                    <select class="form-select"
                            th:field="*{horario}">

                        <option value="">Seleccione un horario</option>

                        <option th:each="horario : ${horarios}"
                                th:value="${horario.idHorario}"
                                th:text="${horario.medico.nombre + ' - ' + horario.diaSemana + ' ' + horario.horaInicio}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Estado

                    </label>

                    <select class="form-select"
                            th:field="*{estado}">

                        <option value="PENDIENTE">
                            Pendiente
                        </option>

                        <option value="CONFIRMADA">
                            Confirmada
                        </option>

                        <option value="CANCELADA">
                            Cancelada
                        </option>

                    </select>

                </div>

                <button type="submit"
                        class="btn btn-success">

                    Guardar

                </button>

                <a th:href="@{/citas}"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
